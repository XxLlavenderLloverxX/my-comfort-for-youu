<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Code Laptop - Natural Boot Sequence</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
            /* Custom default cursor pointing to your cursors folder */
            cursor: url('cursors/BunnyBrown Normal Select.cur'), auto;
        }

        /* Custom cursors for interactive elements */
        a, button, [role="button"], input, textarea {
            cursor: url('cursors/BunnyBrown Move.cur'), pointer;
        }

        /* Scene container handling the final zoom */
        .scene-container {
            width: 850px;
            max-width: 95vw;
            animation: finalZoom 0.8s cubic-bezier(0.77, 0, 0.175, 1) 5.5s forwards;
            transform-origin: center center;
        }

        @keyframes finalZoom {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(12);
                opacity: 1;
            }
        }

        /* Fade-in container for the laptop */
        .laptop-wrapper {
            opacity: 0;
            transform: scale(0.95);
            animation: fadeInLaptop 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInLaptop {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Laptop Chassis */
        .laptop-screen-assembly {
            background: #f4e8ec;
            border: 6px solid #e8d5dd;
            border-radius: 20px 20px 0 0;
            padding: 18px 18px 12px 18px;
            box-shadow: 0 10px 30px rgba(180, 150, 160, 0.15);
            position: relative;
        }

        /* Webcam */
        .webcam {
            width: 8px;
            height: 8px;
            background: #c5b2bc;
            border-radius: 50%;
            margin: 0 auto 10px auto;
        }

        /* Screen Display / Black Screen with Natural Glow Animation */
        .screen-display {
            background: #000000;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #d9c5ce;
            height: 360px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Natural Lens Flare Container */
        .flare-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: containerAppear 0.4s ease 1.2s forwards;
        }

        @keyframes containerAppear {
            to { opacity: 1; }
        }

        /* Soft Organic Core Glow */
        .flare-core {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.8) 40%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            filter: blur(1px);
            box-shadow: 0 0 25px 8px rgba(255, 255, 255, 0.85), 0 0 50px 20px rgba(220, 235, 255, 0.4);
            animation: pulseCore 4s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
        }

        /* Natural Star Rays using smooth radial and soft gradients */
        .ray-horizontal {
            position: absolute;
            height: 4px;
            width: 0px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,1) 0%, rgba(255,255,255,0.7) 30%, transparent 100%);
            filter: blur(1.5px);
            animation: pulseHorizontal 4s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
        }

        .ray-vertical {
            position: absolute;
            width: 4px;
            height: 0px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,1) 0%, rgba(255,255,255,0.7) 30%, transparent 100%);
            filter: blur(1.5px);
            animation: pulseVertical 4s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
        }

        .ray-diagonal-1, .ray-diagonal-2 {
            position: absolute;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.3) 40%, transparent 100%);
            filter: blur(2px);
            animation: pulseDiagonals 4s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
        }

        .ray-diagonal-1 {
            width: 3px;
            height: 0px;
            transform: rotate(45deg);
        }

        .ray-diagonal-2 {
            width: 3px;
            height: 0px;
            transform: rotate(-45deg);
        }

        /* Organic & Progressive Pulsing Keyframes */
        @keyframes pulseCore {
            0% { transform: scale(0.1); opacity: 0; }
            /* Pulse 1 */
            15% { transform: scale(0.7); opacity: 0.5; }
            30% { transform: scale(0.3); opacity: 0.2; }
            /* Pulse 2 (Brighter & Smoother) */
            48% { transform: scale(1.3); opacity: 0.8; }
            62% { transform: scale(0.5); opacity: 0.3; }
            /* Pulse 3 (Peak Elegance) */
            78% { transform: scale(2.2); opacity: 1; }
            88% { transform: scale(1.0); opacity: 0.5; }
            /* Grand Flash Explosion to Full White */
            95% { transform: scale(30); opacity: 1; background: #ffffff; }
            100% { transform: scale(60); opacity: 1; background: #ffffff; }
        }

        @keyframes pulseHorizontal {
            0% { width: 0px; opacity: 0; }
            15% { width: 80px; opacity: 0.6; }
            30% { width: 30px; opacity: 0.2; }
            48% { width: 160px; opacity: 0.85; }
            62% { width: 60px; opacity: 0.3; }
            78% { width: 260px; opacity: 1; }
            88% { width: 110px; opacity: 0.5; }
            95% { width: 800px; opacity: 1; }
            100% { width: 1200px; opacity: 1; }
        }

        @keyframes pulseVertical {
            0% { height: 0px; opacity: 0; }
            15% { height: 80px; opacity: 0.6; }
            30% { height: 30px; opacity: 0.2; }
            48% { height: 160px; opacity: 0.85; }
            62% { height: 60px; opacity: 0.3; }
            78% { height: 260px; opacity: 1; }
            88% { height: 110px; opacity: 0.5; }
            95% { height: 800px; opacity: 1; }
            100% { height: 1200px; opacity: 1; }
        }

        @keyframes pulseDiagonals {
            0% { height: 0px; opacity: 0; }
            15% { height: 40px; opacity: 0.3; }
            30% { height: 15px; opacity: 0.1; }
            48% { height: 90px; opacity: 0.5; }
            62% { height: 30px; opacity: 0.15; }
            78% { height: 150px; opacity: 0.75; }
            88% { height: 60px; opacity: 0.3; }
            95% { height: 600px; opacity: 1; }
            100% { height: 900px; opacity: 1; }
        }

        /* Laptop Base / Keyboard Deck */
        .laptop-base {
            background: #f4e8ec;
            height: 35px;
            border-radius: 0 0 20px 20px;
            border: 6px solid #e8d5dd;
            border-top: none;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .laptop-lip {
            width: 120px;
            height: 5px;
            background: #d9c5ce;
            border-radius: 0 0 5px 5px;
            position: absolute;
            bottom: -6px;
        }

        .keyboard-area {
            background: #eacfd7;
            height: 150px;
            border-radius: 0 0 16px 16px;
            border: 6px solid #e8d5dd;
            border-top: none;
            padding: 10px 25px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.03);
        }

        .key-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .key {
            background: #fdf5f7;
            height: 22px;
            flex: 1;
            border-radius: 4px;
            border-bottom: 2px solid #d9c5ce;
        }

        .key.space {
            flex: 5;
        }

        .trackpad {
            width: 140px;
            height: 35px;
            background: #fdf5f7;
            margin: 8px auto 0 auto;
            border-radius: 6px;
            border-bottom: 2px solid #d9c5ce;
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <div class="laptop-wrapper">
            <!-- Screen Assembly -->
            <div class="laptop-screen-assembly">
                <div class="webcam"></div>
                <div class="screen-display">
                    <!-- Natural Soft Glow & Flare Sequence -->
                    <div class="flare-container">
                        <div class="ray-horizontal"></div>
                        <div class="ray-vertical"></div>
                        <div class="ray-diagonal-1"></div>
                        <div class="ray-diagonal-2"></div>
                        <div class="flare-core"></div>
                    </div>
                </div>
            </div>

            <!-- Keyboard Deck -->
            <div class="keyboard-area">
                <div class="key-row"><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div></div>
                <div class="key-row"><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div></div>
                <div class="key-row"><div class="key" style="flex: 1.5;"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key" style="flex: 1.5;"></div></div>
                <div class="key-row"><div class="key space"></div></div>
                <div class="trackpad"></div>
            </div>
            <div class="laptop-base">
                <div class="laptop-lip"></div>
            </div>
        </div>
    </div>

</body>
</html>
